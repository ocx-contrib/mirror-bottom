# Repo-wide policy for the bottom mirror.
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations — stays
# in bottom/mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. This repo
# is single-package, so `platforms:` lives HERE and bottom/mirror.yml does not
# restate it — the trap is structurally eliminated rather than merely avoided.

skip_prereleases: true
cascade: true

# Upstream also tags `nightly-<hash>-<timestamp>` builds. Those are flagged
# `prerelease: true` by the GitHub API, so `skip_prereleases` already excludes
# them and the tag_pattern in bottom/mirror.yml excludes them a second time
# (they do not match bare `X.Y.Z`).

# New package, so the fleet rule applies unconditionally. A cascade tag
# (`latest`, `0`, `0.14`) re-points on every re-publish; without a build
# segment the new manifest reuses the bare version tag and orphans the prior
# digest for registry GC, breaking any `@sha256:` pin in a consumer's ocx.lock.
# The `none` exception applies only where upstream versions ALREADY carry
# semver build metadata — bottom tags bare semver (`0.14.7`), so it does not.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are ~1.6–2.1 MB archives around a single binary plus completions.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built, and a musl target TRIPLE is not a musl
# requirement. Measured per arch on BOTH ends of the range (0.14.5 and 0.14.7;
# full evidence above `assets:` in bottom/mirror.yml):
#
#   linux/amd64  — `bottom_x86_64-unknown-linux-musl.tar.gz` is static-pie:
#                  INTERP segment count 0, zero DT_NEEDED. It requires nothing
#                  of the host → BARE key. `+libc.musl` would be a false
#                  requirement that hid the package from every glibc host it in
#                  fact runs on.
#   linux/arm64  — `bottom_aarch64-unknown-linux-musl.tar.gz` is likewise fully
#                  static (INTERP 0, NEEDED 0) → BARE key. Symmetric with
#                  amd64 because the measurement came out symmetric, not
#                  because the filenames look alike.
#
# A bare key claims universality, so it must PROVE it: ubuntu (glibc) + alpine
# (musl) + fedora (a different glibc vintage) on both arches. THE ALPINE LEG IS
# THE PROOF — drop it and the claim is merely asserted. No `containers[].setup`
# is needed: the binaries have zero dynamic dependencies, so there is nothing
# for a stock image to be missing.
#
# Staged rollout (skill Phase 10): darwin and windows are pre-written and
# commented out below AND in `assets:`, uncommented one pass at a time once the
# Linux legs are end-to-end green. Both the platform key and its asset pattern
# are commented together — a declared-but-unmatched platform still boots a real
# runner and reports SUCCESS having tested nothing.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # PASS 2 — darwin:
  # darwin/amd64:
  #   # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
  #   # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
  #   runner: macos-14
  #   prefix: ["arch", "-x86_64"]
  # darwin/arm64:
  #   runner: macos-14
  #   shell: bash
  #
  # PASS 3 — windows:
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64:
  #   # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
  #   runner: windows-11-arm
  #   shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
